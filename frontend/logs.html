<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevGuard Logs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f8fb;
            color: #111827;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #111827;
            padding: 25px 15px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            padding: 0 12px;
        }

        .menu {
            display: block;
            color: #9ca3af;
            text-decoration: none;
            padding: 13px 12px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .menu:hover,
        .menu.active {
            background: #1f2937;
            color: white;
        }

        .main {
            margin-left: 230px;
            padding: 30px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            color: #6b7280;
        }

        .logs {
            margin-top: 25px;
            background: #111827;
            color: #d1d5db;
            padding: 25px;
            border-radius: 12px;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .log-line {
            margin-bottom: 6px;
        }

        .success {
            color: #22c55e;
        }

        .waiting {
            color: #f59e0b;
        }

        .failed {
            color: #ef4444;
        }

        .empty {
            color: #9ca3af;
            text-align: center;
            padding: 30px;
        }

        .error {
            color: #ef4444;
        }
    </style>

</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            DevGuard
        </div>

        <a href="index.html" class="menu">
            Dashboard
        </a>

        <a href="projects.html" class="menu">
            Projects
        </a>

        <a href="deployments.html" class="menu">
            Deployments
        </a>

        <a href="pipeline.html" class="menu">
            Pipelines
        </a>

        <a href="logs.html" class="menu active">
            Logs
        </a>

        <a href="#" class="menu">
            AI Assistant
        </a>

    </aside>


    <main class="main">

        <div class="header">

            <h1>
                Deployment Logs
            </h1>

            <p>
                View pipeline and deployment logs.
            </p>

        </div>


        <div class="logs" id="logContainer">

            <div class="empty">
                Loading logs...
            </div>

        </div>

    </main>


    <script>

        const API_URL = "http://16.171.171.86:5000";


        async function loadLogs() {

            const container =
                document.getElementById("logContainer");

            try {

                const response =
                    await fetch(`${API_URL}/logs`);


                if (!response.ok) {
                    throw new Error("Failed to load logs");
                }


                const logs =
                    await response.json();


                if (logs.length === 0) {

                    container.innerHTML = `
                        <div class="empty">
                            No logs available.
                        </div>
                    `;

                    return;
                }


                container.innerHTML = "";


                logs.forEach(log => {

                    const line =
                        document.createElement("div");

                    line.className = "log-line";


                    const message =
                        log.message.toLowerCase();


                    let statusClass = "";


                    if (
                        message.includes("success") ||
                        message.includes("completed") ||
                        message.includes("passed") ||
                        message.includes("built")
                    ) {

                        statusClass = "success";

                    }


                    if (
                        message.includes("pending") ||
                        message.includes("waiting")
                    ) {

                        statusClass = "waiting";

                    }


                    if (
                        message.includes("failed") ||
                        message.includes("error")
                    ) {

                        statusClass = "failed";

                    }


                    line.innerHTML = `
                        <span class="${statusClass}">
                            [${log.id}]
                        </span>
                        ${log.message}
                    `;


                    container.appendChild(line);

                });


            } catch (error) {

                console.error(
                    "Logs loading error:",
                    error
                );

                container.innerHTML = `
                    <div class="error">
                        Failed to connect to backend.
                    </div>
                `;

            }

        }


        loadLogs();

    </script>

</body>

</html>
