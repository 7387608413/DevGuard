<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevGuard Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .sidebar {
            position: fixed;
            width: 220px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .menu {
            display: block;
            padding: 13px 10px;
            margin-bottom: 5px;
            color: #d1d5db;
            text-decoration: none;
            border-radius: 8px;
        }

        .menu:hover {
            background: #1f2937;
            color: white;
        }

        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .number {
            font-size: 28px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #6b7280;
            font-size: 14px;
        }

        .success {
            color: #16a34a;
            font-weight: bold;
        }

        .failed {
            color: #dc2626;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="logo">DevGuard</div>

        <a href="#" class="menu">Dashboard</a>
        <a href="#" class="menu">Projects</a>
        <a href="#" class="menu">Deployments</a>
        <a href="#" class="menu">Pipelines</a>
        <a href="#" class="menu">Logs</a>
        <a href="#" class="menu">AI Assistant</a>
    </aside>

    <main class="main">

        <div class="header">
            <h1>Dashboard</h1>
            <p>Monitor your DevOps deployments</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Total Projects</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Successful Deployments</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Failed Deployments</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Active Pipelines</h3>
                <div class="number">0</div>
            </div>

        </div>

        <div class="section">
            <h2>Recent Deployments</h2>

            <table>
                <thead>
                    <tr>
                        <th>Project</th>
                        <th>Status</th>
                        <th>Deployment</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>No deployments yet</td>
                        <td>-</td>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
