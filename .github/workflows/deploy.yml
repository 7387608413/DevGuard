name: DevGuard CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Check
        run: echo "Build successful"

      - name: Test Check
        run: echo "Tests passed"

      - name: Build Docker Image
        run: docker build -t devguard .